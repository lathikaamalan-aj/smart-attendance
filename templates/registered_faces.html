<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registered Faces</title>
<style>
  :root {
    --bg: #f3f6fd; --card: #ffffff; --text: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --primary: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1220; --card: #131c2e; --text: #e5eaf5; --muted: #94a3b8; --line: #243049; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 24px; }
  a.back { color: var(--primary); text-decoration: none; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .tools input, .tools select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font-size: 14px; }
  .tools input { flex: 1; min-width: 200px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; }
  .card:hover { border-color: var(--primary); }
  .photo { height: 170px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; color: var(--muted); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 12px 14px 14px; }
  .name { font-weight: 700; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .registered { background: var(--ok); } .incomplete { background: var(--warn); } .not_registered { background: var(--bad); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.open { display: flex; }
  .box { background: var(--card); border-radius: 14px; max-width: 760px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; }
  .box h2 { margin: 0 0 4px; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 14px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  button.close { float: right; border: 0; background: var(--line); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Registered Faces</h1>
    <a class="back" href="/admin">&larr; Back to dashboard</a>
  </div>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Total students</span></div>
    <div class="stat"><b id="sReg">0</b><span>Face registered</span></div>
    <div class="stat"><b id="sInc">0</b><span>Incomplete</span></div>
    <div class="stat"><b id="sSamples">0</b><span>Total samples</span></div>
  </div>

  <div class="tools">
    <input id="search" type="search" placeholder="Search name or register number">
    <select id="filter">
      <option value="all">All</option>
      <option value="registered">Registered</option>
      <option value="incomplete">Incomplete</option>
      <option value="not_registered">Not registered</option>
    </select>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No students found.</div>
</div>

<div id="modal" class="modal">
  <div class="box">
    <button class="close" id="closeBtn">Close</button>
    <h2 id="mName"></h2>
    <div id="mMeta" class="meta"></div>
    <div id="mThumbs" class="thumbs"></div>
  </div>
</div>

<script>
const REQUIRED = {{ required|tojson }};
const LABEL = { registered: "Registered", incomplete: "Incomplete", not_registered: "Not registered" };
let students = [];

function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const f = document.getElementById("filter").value;
  const list = students.filter(function (s) {
    const hit = !q || s.name.toLowerCase().includes(q) || s.student_id.toLowerCase().includes(q);
    return hit && (f === "all" || s.status === f);
  });

  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("grid").innerHTML = list.map(function (s) {
    const photo = s.photo
      ? '<img src="' + esc(s.photo) + '" alt="" loading="lazy">'
      : esc((s.name || "?").charAt(0).toUpperCase());
    return '<div class="card" data-id="' + esc(s.student_id) + '">' +
      '<div class="photo">' + photo + '</div>' +
      '<div class="info"><p class="name">' + esc(s.name) + '</p>' +
      '<p class="meta">' + esc(s.student_id) + ' &middot; ' + esc(s.year) + ' ' + esc(s.department) + '</p>' +
      '<span class="badge ' + s.status + '">' + LABEL[s.status] + ' (' + s.samples + '/' + REQUIRED + ')</span>' +
      '</div></div>';
  }).join("");
}

async function load() {
  const res = await fetch("/api/registered_faces", { credentials: "same-origin" });
  const data = await res.json();
  if (!data.success) {
    document.getElementById("empty").textContent = data.message || "Could not load faces.";
    document.getElementById("empty").style.display = "block";
    return;
  }
  students = data.students;
  document.getElementById("sTotal").textContent = data.summary.total_students;
  document.getElementById("sReg").textContent = data.summary.registered;
  document.getElementById("sInc").textContent = data.summary.incomplete;
  document.getElementById("sSamples").textContent = data.summary.total_samples;
  render();
}

async function openStudent(id) {
  const res = await fetch("/api/registered_faces/" + encodeURIComponent(id), { credentials: "same-origin" });
  const d = await res.json();
  if (!d.success) return;
  document.getElementById("mName").textContent = d.name;
  document.getElementById("mMeta").textContent =
    d.student_id + " \u00b7 " + d.year + " " + d.department + " \u00b7 " + d.samples + "/" + d.required + " samples";
  document.getElementById("mThumbs").innerHTML = d.images.length
    ? d.images.map(function (i) { return '<img src="' + esc(i.url) + '" alt="Sample ' + i.number + '" loading="lazy">'; }).join("")
    : '<div class="empty" style="grid-column:1/-1">No face samples yet.</div>';
  document.getElementById("modal").classList.add("open");
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);
document.getElementById("grid").addEventListener("click", function (e) {
  const card = e.target.closest(".card");
  if (card) openStudent(card.dataset.id);
});
document.getElementById("closeBtn").addEventListener("click", function () {
  document.getElementById("modal").classList.remove("open");
});
document.getElementById("modal").addEventListener("click", function (e) {
  if (e.target.id === "modal") e.currentTarget.classList.remove("open");
});

load();
</script>
</body>
</html>
