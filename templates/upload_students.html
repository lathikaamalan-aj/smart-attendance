<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student – Admin Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

:root{
    --ink:#1B2B22;
    --paper:#F7F4EC;
    --card:#FCFAF4;
    --moss:#3D5A45;
    --moss-dark:#2C4433;
    --gold:#B8863E;
    --gold-soft:#E4CFA0;
    --line:#DCD5C4;
    --muted:#6B6558;
    --red:#9C4A3E;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
}

h1,h2,h3{
    font-family:'Source Serif 4',Georgia,serif;
}

main{
    max-width:760px;
    margin:0 auto;
    padding:48px 32px 80px;
}

.back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
    margin-bottom:20px;
}

.back-link:hover{
    color:var(--ink);
}

header.top{
    padding-bottom:24px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
}

header.top h1{
    font-size:28px;
    font-weight:600;
    margin:0 0 6px 0;
}

header.top p{
    margin:0;
    color:var(--muted);
    font-size:14px;
}

.mode-switch{
    display:flex;
    border:1px solid var(--line);
    margin-bottom:32px;
    background:var(--card);
}

.mode-btn{
    flex:1;
    padding:14px 16px;
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    position:relative;
    transition:color .15s ease;
}

.mode-btn:first-child{
    border-right:1px solid var(--line);
}

.mode-btn.active{
    color:var(--ink);
}

.mode-btn.active::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-1px;
    height:2px;
    background:var(--gold);
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:16px;
}

.field{
    margin-bottom:16px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
}

.field input,
.field select{
    width:100%;
    padding:10px 12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
}

.field input:focus,
.field select:focus{
    outline:none;
    border-color:var(--moss);
}

.form-actions{
    display:flex;
    gap:12px;
    margin-top:8px;
}

.btn-primary{
    padding:11px 22px;
    background:var(--moss-dark);
    color:var(--paper);
    border:none;
    font-size:14px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
}

.btn-primary:hover{
    background:var(--ink);
}

.btn-primary:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-secondary{
    padding:11px 22px;
    background:none;
    color:var(--muted);
    border:1px solid var(--line);
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
}

.btn-secondary:hover{
    border-color:var(--ink);
    color:var(--ink);
}

.confirm{
    margin-top:16px;
    padding:12px 14px;
    border:1px solid var(--moss);
    color:var(--moss-dark);
    font-size:13px;
    display:none;
}

.confirm.show{
    display:block;
}

.error-message{
    margin-top:16px;
    padding:12px 14px;
    border:1px solid var(--red);
    color:var(--red);
    font-size:13px;
    display:none;
}

.error-message.show{
    display:block;
}

.dropzone{
    border:1px dashed var(--line);
    background:var(--card);
    padding:40px 24px;
    text-align:center;
    cursor:pointer;
}

.dropzone.dragover{
    border-color:var(--gold);
    background:#FBF3E3;
}

.dropzone .icon{
    font-size:22px;
    color:var(--moss-dark);
    margin-bottom:10px;
    display:block;
}

.dropzone h3{
    font-size:16px;
    font-weight:600;
    margin:0 0 6px 0;
}

.dropzone p{
    font-size:13px;
    color:var(--muted);
    margin:0;
}

.dropzone input[type="file"]{
    display:none;
}

.file-hint{
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
    text-align:center;
}

.file-summary{
    display:none;
    align-items:center;
    justify-content:space-between;
    border:1px solid var(--line);
    background:var(--card);
    padding:12px 16px;
    margin-top:16px;
    font-size:14px;
}

.file-summary.show{
    display:flex;
}

.file-summary .name{
    font-weight:500;
}

.file-summary .remove{
    background:none;
    border:none;
    color:var(--red);
    cursor:pointer;
    font-size:13px;
    font-family:'Inter',sans-serif;
}

.preview-label{
    font-size:13px;
    color:var(--muted);
    margin:24px 0 12px 0;
}

.table-wrap{
    border:1px solid var(--line);
    background:var(--card);
    overflow-x:auto;
    max-height:320px;
    overflow-y:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th{
    text-align:left;
    font-weight:500;
    color:var(--muted);
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    background:var(--card);
    position:sticky;
    top:0;
}

td{
    padding:9px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
}

tr:last-child td{
    border-bottom:none;
}

@media(max-width:600px){

    .field-row{
        grid-template-columns:1fr;
    }

    main{
        padding:32px 18px 60px;
    }
}

</style>
</head>

<body>

<main>

<a class="back-link" href="/admin">
    &larr; Back to dashboard
</a>

<header class="top">

    <h1>Add student</h1>

    <p>
        Enroll one student by hand, or bring in a class list from a spreadsheet.
    </p>

</header>


<div class="mode-switch">

    <button class="mode-btn active" data-mode="single">
        Add one student
    </button>

    <button class="mode-btn" data-mode="upload">
        Upload a file
    </button>

</div>


<!-- =====================================================
     SINGLE STUDENT
===================================================== -->

<section class="panel active" id="panel-single">

<form id="single-form">

<div class="field-row">

    <div class="field">

        <label for="student-id">
            Student ID
        </label>

        <input
            type="text"
            id="student-id"
            required
        >

    </div>


    <div class="field">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            required
        >

    </div>

</div>


<div class="field-row">

    <div class="field">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            required
        >

    </div>


    <div class="field">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            required
        >

    </div>

</div>


<div class="field-row">

    <div class="field">

        <label for="year">
            Year
        </label>

        <select id="year" required>

            <option value="">
                Select year
            </option>

            <option value="1st Year">
                1st Year
            </option>

            <option value="2nd Year">
                2nd Year
            </option>

            <option value="3rd Year">
                3rd Year
            </option>

            <option value="4th Year">
                4th Year
            </option>

        </select>

    </div>


    <div class="field">

        <label for="department">
            Department
        </label>

        <input
            type="text"
            id="department"
            placeholder="e.g. Computer Science"
            required
        >

    </div>

</div>


<div class="form-actions">

    <button
        type="submit"
        class="btn-primary"
        id="add-student-btn"
    >
        Add student
    </button>

    <button
        type="reset"
        class="btn-secondary"
        id="clear-form"
    >
        Clear form
    </button>

</div>


<div
    class="confirm"
    id="single-confirm"
></div>


<div
    class="error-message"
    id="single-error"
></div>

</form>

</section>



<!-- =====================================================
     UPLOAD PANEL
===================================================== -->

<section class="panel" id="panel-upload">

<div
    class="dropzone"
    id="dropzone"
>

    <span class="icon">
        &#8613;
    </span>

    <h3>
        Drop a CSV or Excel file here
    </h3>

    <p>
        or click to browse your computer
    </p>

    <input
        type="file"
        id="file-input"
        accept=".csv,.xlsx,.xls"
    >

</div>


<div class="file-hint">

    Expected columns:
    student ID, name, username, password, year, department

</div>


<div
    class="file-summary"
    id="file-summary"
>

    <span
        class="name"
        id="file-name"
    ></span>

    <button
        class="remove"
        id="file-remove"
        type="button"
    >
        Remove
    </button>

</div>


<div
    id="preview-area"
    style="display:none;"
>

    <div
        class="preview-label"
        id="preview-label"
    >
        Preview
    </div>


    <div class="table-wrap">

        <table id="preview-table"></table>

    </div>


    <div
        class="form-actions"
        style="margin-top:20px;"
    >

        <button
            class="btn-primary"
            id="confirm-upload"
            type="button"
        >
            Add all students
        </button>

        <button
            class="btn-secondary"
            id="cancel-upload"
            type="button"
        >
            Cancel
        </button>

    </div>


    <div
        class="confirm"
        id="upload-confirm"
    ></div>

</div>

</section>

</main>



<script>

/* =====================================================
   MODE SWITCHING
===================================================== */

const modeBtns =
    document.querySelectorAll(".mode-btn");

const panels = {

    single:
        document.getElementById("panel-single"),

    upload:
        document.getElementById("panel-upload")

};


modeBtns.forEach(btn => {

    btn.addEventListener("click", () => {

        modeBtns.forEach(b =>
            b.classList.remove("active")
        );

        btn.classList.add("active");

        Object.values(panels).forEach(panel =>
            panel.classList.remove("active")
        );

        panels[btn.dataset.mode]
            .classList.add("active");

    });

});



/* =====================================================
   SINGLE STUDENT
===================================================== */

const singleForm =
    document.getElementById("single-form");

const singleConfirm =
    document.getElementById("single-confirm");

const singleError =
    document.getElementById("single-error");

const addStudentBtn =
    document.getElementById("add-student-btn");


singleForm.addEventListener("submit", async (e) => {

    e.preventDefault();


    singleConfirm.classList.remove("show");
    singleError.classList.remove("show");


    const student_id =
        document.getElementById("student-id")
        .value
        .trim();

    const name =
        document.getElementById("name")
        .value
        .trim();

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value
        .trim();

    const year =
        document.getElementById("year")
        .value
        .trim();

    const department =
        document.getElementById("department")
        .value
        .trim();


    if (
        !student_id ||
        !name ||
        !username ||
        !password ||
        !year ||
        !department
    ){

        singleError.textContent =
            "Please fill all fields.";

        singleError.classList.add("show");

        return;
    }


    addStudentBtn.disabled = true;

    addStudentBtn.textContent =
        "Saving...";


    try {

        const response =
            await fetch("/add_student", {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    student_id:
                        student_id,

                    name:
                        name,

                    username:
                        username,

                    password:
                        password,

                    year:
                        year,

                    department:
                        department

                })

            });


        const result =
            await response.json();


        if(result.success){

            singleConfirm.textContent =
                result.message;

            singleConfirm.classList.add("show");

            singleForm.reset();

        }
        else{

            singleError.textContent =
                result.message ||
                "Unable to add student.";

            singleError.classList.add("show");

        }


    }
    catch(error){

        console.error(
            "Add student error:",
            error
        );

        singleError.textContent =
            "Could not connect to Flask server.";

        singleError.classList.add("show");

    }


    addStudentBtn.disabled = false;

    addStudentBtn.textContent =
        "Add student";

});



/* =====================================================
   FILE UPLOAD
===================================================== */

const dropzone =
    document.getElementById("dropzone");

const fileInput =
    document.getElementById("file-input");

const fileSummary =
    document.getElementById("file-summary");

const fileNameEl =
    document.getElementById("file-name");

const fileRemove =
    document.getElementById("file-remove");

const previewArea =
    document.getElementById("preview-area");

const previewLabel =
    document.getElementById("preview-label");

const previewTable =
    document.getElementById("preview-table");

const confirmUploadBtn =
    document.getElementById("confirm-upload");

const cancelUploadBtn =
    document.getElementById("cancel-upload");

const uploadConfirm =
    document.getElementById("upload-confirm");


let parsedRows = [];


dropzone.addEventListener(
    "click",
    () => fileInput.click()
);


["dragover","dragenter"].forEach(evt => {

    dropzone.addEventListener(evt, e => {

        e.preventDefault();

        dropzone.classList.add("dragover");

    });

});


["dragleave","drop"].forEach(evt => {

    dropzone.addEventListener(evt, e => {

        e.preventDefault();

        dropzone.classList.remove("dragover");

    });

});


dropzone.addEventListener("drop", e => {

    const file =
        e.dataTransfer.files[0];

    if(file){

        handleFile(file);

    }

});


fileInput.addEventListener(
    "change",
    e => {

        const file =
            e.target.files[0];

        if(file){

            handleFile(file);

        }

    }
);


fileRemove.addEventListener(
    "click",
    resetUpload
);


cancelUploadBtn.addEventListener(
    "click",
    resetUpload
);


function resetUpload(){

    fileInput.value = "";

    fileSummary.classList.remove("show");

    previewArea.style.display = "none";

    uploadConfirm.classList.remove("show");

    parsedRows = [];

}


function handleFile(file){

    const reader =
        new FileReader();

    const isCSV =
        /\.csv$/i.test(file.name);


    reader.onload = e => {

        let rows = [];


        try{

            if(isCSV){

                rows =
                    parseCSV(
                        e.target.result
                    );

            }
            else{

                const wb =
                    XLSX.read(
                        e.target.result,
                        {type:"array"}
                    );

                const sheet =
                    wb.Sheets[
                        wb.SheetNames[0]
                    ];

                rows =
                    XLSX.utils.sheet_to_json(
                        sheet,
                        {
                            header:1,
                            defval:""
                        }
                    );

            }

        }
        catch(error){

            alert(
                "Could not read that file."
            );

            return;

        }


        if(!rows.length){

            alert(
                "That file appears to be empty."
            );

            return;

        }


        parsedRows = rows;

        fileNameEl.textContent =
            file.name;

        fileSummary.classList.add(
            "show"
        );

        renderPreview(rows);

    };


    if(isCSV){

        reader.readAsText(file);

    }
    else{

        reader.readAsArrayBuffer(file);

    }

}


function parseCSV(text){

    return text
        .trim()
        .split(/\r?\n/)
        .map(line =>
            line
                .split(",")
                .map(c => c.trim())
        );

}


function renderPreview(rows){

    const header =
        rows[0];

    const body =
        rows
            .slice(1)
            .filter(r =>
                r.some(
                    cell =>
                        String(cell).trim() !== ""
                )
            );


    previewLabel.textContent =
        `Preview — ${body.length} student${body.length === 1 ? "" : "s"} found`;


    let html =
        "<thead><tr>" +
        header
            .map(h =>
                `<th>${escapeHtml(h)}</th>`
            )
            .join("") +
        "</tr></thead>";


    html +=
        "<tbody>" +
        body
            .slice(0,50)
            .map(r =>
                "<tr>" +
                header
                    .map(
                        (_,i) =>
                            `<td>${escapeHtml(
                                r[i] ?? ""
                            )}</td>`
                    )
                    .join("") +
                "</tr>"
            )
            .join("") +
        "</tbody>";


    previewTable.innerHTML =
        html;

    previewArea.style.display =
        "block";

}


function escapeHtml(str){

    return String(str).replace(
        /[&<>"']/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[c])
    );

}



/* =====================================================
   CSV / EXCEL UPLOAD
===================================================== */

confirmUploadBtn.addEventListener(
    "click",
    async () => {

        if(
            !parsedRows ||
            parsedRows.length < 2
        ){

            alert(
                "Please select a CSV or Excel file first."
            );

            return;

        }


        confirmUploadBtn.disabled =
            true;

        confirmUploadBtn.textContent =
            "Saving...";


        try{

            const response =
                await fetch(
                    "/upload_students_csv",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            rows:parsedRows
                        })

                    }
                );


            const result =
                await response.json();


            if(result.success){

                uploadConfirm.textContent =
                    `${result.added} student(s) added successfully.`;

                uploadConfirm.classList.add(
                    "show"
                );


                if(result.skipped > 0){

                    uploadConfirm.textContent +=
                        ` ${result.skipped} row(s) skipped.`;

                }


                parsedRows = [];

            }
            else{

                alert(
                    result.message ||
                    "Upload failed."
                );

            }

        }
        catch(error){

            console.error(
                "Upload error:",
                error
            );

            alert(
                "Could not connect to Flask server."
            );

        }


        confirmUploadBtn.disabled =
            false;

        confirmUploadBtn.textContent =
            "Add all students";

    }
);

</script>

</body>
</html>
